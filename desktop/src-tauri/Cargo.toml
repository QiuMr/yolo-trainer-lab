[package]
name = "desktop"
version = "0.1.0"
description = "YOLO Trainer desktop shell (drives the montgomery engine as a sidecar)"
authors = ["QiuMr"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Pretrained weights are fetched on demand from a GitHub Release. `reqwest` rather than a new HTTP
# crate because the updater plugin already pulls it in — reusing it costs no new dependency, and D
# drive (the shared cargo cache) is out of space, so a fresh download would not even build. The
# blocking client is used from a dedicated thread: the download loop reads the body in chunks to
# emit progress, which is awkward to express in an async stream for no benefit.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
# `rustls-no-provider` deliberately leaves the crypto backend to the application, so one has to be
# installed before the first client is built. `ring` because it is already compiled into the tree
# (the updater brings it in); `default-features = false` keeps rustls from adding aws-lc-rs, which
# would be a new crate to download and a C toolchain to build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
